<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Architect — RPG AI</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg:     #08090d;
  --panel:  #0f1117;
  --panel2: #0b0d12;
  --border: #232635;
  --accent: #4a9eff;
  --gold:   #c8a84b;
  --text:   #ccd0dc;
  --muted:  #525868;
  --green:  #4caf7d;
  --red:    #e05c5c;
  --orange: #e09050;
  --purple: #9b7be8;
}
html, body { height: 100%; overflow: hidden; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Courier New', Courier, monospace;
  font-size: 15px;
  line-height: 1.55;
}
.hidden { display: none !important; }
.screen { position: absolute; inset: 0; display: none; flex-direction: column; }
.screen.active { display: flex; }

/* ── BOOT ─────────────────────────────────────────────── */
#screen-boot {
  justify-content: center; align-items: center;
  background: radial-gradient(ellipse at 50% 55%, #0d1020 0%, var(--bg) 70%);
}
.boot-kicker { font-size: 12px; letter-spacing: 6px; color: var(--muted); margin-bottom: 10px; text-transform: uppercase; }
.boot-title  { font-size: 42px; color: var(--accent); letter-spacing: 6px; text-transform: uppercase; font-weight: bold; }
.boot-line   { width: 120px; height: 1px; background: var(--border); margin: 14px auto; }
.boot-sub    { font-size: 13px; color: var(--muted); letter-spacing: 2px; margin-bottom: 48px; }
.boot-btn {
  background: transparent; border: 1px solid var(--accent); color: var(--accent);
  font-family: inherit; font-size: 13px; letter-spacing: 5px; text-transform: uppercase;
  padding: 13px 40px; cursor: pointer; transition: background .2s, color .2s;
}
.boot-btn:hover { background: var(--accent); color: var(--bg); }
.boot-restore  {
  margin-top: 18px; font-size: 12px; color: var(--muted);
  cursor: pointer; letter-spacing: 1px; text-decoration: none;
}
.boot-restore:hover { color: var(--text); }

/* ── ONBOARDING ────────────────────────────────────────── */
.onboard-hdr {
  padding: 12px 20px; border-bottom: 1px solid var(--border);
  background: var(--panel); display: flex; align-items: center; gap: 12px; flex-shrink: 0;
}
.onboard-hdr-title { font-size: 13px; letter-spacing: 3px; color: var(--accent); text-transform: uppercase; flex: 1; }
.onboard-badge {
  font-size: 12px; color: var(--muted); border: 1px solid var(--border);
  border-radius: 3px; padding: 2px 8px;
}
.chat-log {
  flex: 1; overflow-y: auto; padding: 20px;
  display: flex; flex-direction: column; gap: 14px;
}
.msg-row { display: flex; gap: 12px; max-width: 740px; }
.msg-row.user { align-self: flex-end; flex-direction: row-reverse; }
.msg-speaker {
  font-size: 11px; letter-spacing: 1px; text-transform: uppercase;
  color: var(--muted); flex-shrink: 0; margin-top: 3px; width: 76px;
}
.msg-row.user .msg-speaker { text-align: right; color: var(--accent); }
.msg-bubble {
  background: var(--panel); border: 1px solid var(--border); border-radius: 4px;
  padding: 10px 14px; white-space: pre-wrap; line-height: 1.65; max-width: 680px;
  font-size: 14px;
}
.msg-row.user .msg-bubble { background: #131826; border-color: #2a3550; color: var(--accent); }
.typing-cur::after { content: '▋'; animation: blink .8s step-end infinite; color: var(--accent); }
@keyframes blink { 50% { opacity: 0; } }
.chat-input-area {
  padding: 12px 20px; border-top: 1px solid var(--border);
  display: flex; gap: 10px; align-items: center; flex-shrink: 0;
}
.chat-input {
  flex: 1; background: var(--panel); border: 1px solid var(--border); border-radius: 4px;
  color: var(--text); font-family: inherit; font-size: 13px; padding: 10px 14px; outline: none;
  transition: border-color .2s;
}
.chat-input:focus { border-color: var(--accent); }
.chat-input:disabled { opacity: .4; }
.btn-send, .btn-gen {
  background: var(--accent); border: none; border-radius: 4px;
  color: var(--bg); font-family: inherit; font-size: 10px; letter-spacing: 2px;
  text-transform: uppercase; padding: 10px 16px; cursor: pointer;
  white-space: nowrap; transition: opacity .2s;
}
.btn-send:disabled { opacity: .4; cursor: not-allowed; }
.btn-gen { background: var(--green); display: none; }
.btn-gen:disabled { opacity: .4; cursor: not-allowed; }

/* ── WORLD CHOICE ──────────────────────────────────────── */
#screen-worlds {
  align-items: center; justify-content: center; padding: 24px; overflow-y: auto;
}
.worlds-hdr { text-align: center; margin-bottom: 28px; max-width: 620px; }
.worlds-hdr h2 { font-size: 12px; letter-spacing: 5px; color: var(--accent); text-transform: uppercase; margin-bottom: 12px; }
.worlds-msg { font-size: 12px; color: var(--muted); line-height: 1.75; white-space: pre-wrap; }
.worlds-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; max-width: 880px; width: 100%; }
@media (max-width: 640px) { .worlds-grid { grid-template-columns: 1fr; } }
.world-card {
  background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
  padding: 22px; cursor: pointer; transition: border-color .2s, transform .15s;
}
.world-card:hover { border-color: var(--accent); transform: translateY(-2px); }
.world-card-lbl { font-size: 10px; letter-spacing: 3px; color: var(--muted); text-transform: uppercase; margin-bottom: 8px; }
.world-card-name { font-size: 17px; color: var(--accent); font-weight: bold; margin-bottom: 5px; }
.world-card-tag { font-size: 12px; color: var(--text); margin-bottom: 10px; }
.world-card-tone {
  display: inline-block; font-size: 10px; letter-spacing: 1px;
  border: 1px solid var(--border); border-radius: 3px; padding: 2px 8px;
  color: var(--muted); margin-bottom: 12px;
}
.world-card-preview { font-size: 11px; color: var(--muted); line-height: 1.65; border-top: 1px solid var(--border); padding-top: 12px; }
.world-card-btn {
  margin-top: 18px; width: 100%;
  background: transparent; border: 1px solid var(--accent); color: var(--accent);
  font-family: inherit; font-size: 10px; letter-spacing: 3px; text-transform: uppercase;
  padding: 10px; cursor: pointer; border-radius: 4px; transition: background .2s, color .2s;
}
.world-card-btn:hover { background: var(--accent); color: var(--bg); }

/* ── GAME SCREEN ───────────────────────────────────────── */
.game-topbar {
  display: flex; align-items: center; gap: 12px; padding: 8px 16px;
  border-bottom: 1px solid var(--border); background: var(--panel); flex-shrink: 0;
}
.game-world-name { font-size: 11px; letter-spacing: 3px; color: var(--accent); text-transform: uppercase; font-weight: bold; flex: 1; }
.game-day { font-size: 10px; color: var(--muted); border: 1px solid var(--border); border-radius: 3px; padding: 2px 8px; }
.game-sid { font-size: 10px; color: var(--muted); cursor: pointer; }
.game-sid:hover { color: var(--text); }
.game-body { flex: 1; display: flex; overflow: hidden; }
.game-log {
  flex: 1; overflow-y: auto; padding: 14px 18px;
  display: flex; flex-direction: column; gap: 1px;
}
.log-e { padding: 2px 0; line-height: 1.7; white-space: pre-wrap; animation: fadeIn .25s ease; font-size: 14px; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.log-e.sys    { color: var(--muted); font-size: 13px; }
.log-e.act    { color: var(--accent); }
.log-e.npc    { color: var(--orange); }
.log-e.reward { color: var(--gold); }
.log-e.evt    { color: var(--purple); }
.log-e.warn   { color: var(--red); }
.log-e.ok     { color: var(--green); }
.log-e.div    { color: var(--border); user-select: none; }
.log-e.prose  { color: var(--text); font-style: italic; }

/* sidebar */
.game-side {
  width: 230px; border-left: 1px solid var(--border); background: var(--panel);
  overflow-y: auto; padding: 14px; flex-shrink: 0;
  display: flex; flex-direction: column; gap: 16px;
}
@media (max-width: 800px) { .game-side { display: none; } }
.side-label {
  font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: var(--muted);
  padding-bottom: 6px; border-bottom: 1px solid var(--border); margin-bottom: 8px;
}
.side-currency { font-size: 24px; color: var(--gold); font-weight: bold; }
.side-cur-name { font-size: 12px; color: var(--muted); }
.side-stat {
  display: flex; justify-content: space-between; align-items: center; padding: 4px 0;
}
.side-stat-name { font-size: 12px; }
.side-stat-right { display: flex; align-items: center; gap: 6px; }
.side-bar { width: 48px; height: 4px; background: var(--border); border-radius: 2px; overflow: hidden; }
.side-bar-fill { height: 100%; background: var(--accent); border-radius: 2px; transition: width .4s; }
.side-stat-val { font-size: 12px; color: var(--accent); width: 16px; text-align: right; }
.side-faction { display: flex; justify-content: space-between; padding: 4px 0; font-size: 12px; align-items: center; }
.flbl {
  font-size: 10px; padding: 1px 5px; border-radius: 2px;
  font-weight: bold; letter-spacing: .5px;
}
.fl-allied   { background: #1a3326; color: var(--green); }
.fl-friendly { background: #1e2e1a; color: #7dcf7d; }
.fl-neutral  { background: #1e2024; color: var(--muted); }
.fl-hostile  { background: #2e1a1a; color: var(--red); }
.fl-war      { background: #3e1010; color: #ff6060; }
.fl-unknown  { background: var(--panel2); color: var(--muted); }

/* action bar */
.game-bar {
  display: flex; gap: 8px; padding: 10px 16px;
  border-top: 1px solid var(--border); background: var(--panel2); flex-shrink: 0; flex-wrap: wrap;
}
.act-btn {
  background: var(--panel); border: 1px solid var(--border); color: var(--text);
  font-family: inherit; font-size: 12px; letter-spacing: 1.5px; text-transform: uppercase;
  padding: 9px 16px; cursor: pointer; border-radius: 4px; transition: border-color .2s, color .2s;
  display: flex; align-items: center; gap: 5px;
}
.act-btn:hover  { border-color: var(--accent); color: var(--accent); }
.act-btn:disabled { opacity: .3; cursor: not-allowed; }
.act-btn.hi { border-color: var(--accent); color: var(--accent); }
.badge {
  background: var(--red); color: #fff; border-radius: 10px;
  font-size: 9px; padding: 1px 5px; min-width: 16px; text-align: center;
}

/* ── MODAL ─────────────────────────────────────────────── */
#overlay {
  position: fixed; inset: 0; z-index: 100; background: rgba(0,0,0,.72);
  display: flex; align-items: center; justify-content: center; padding: 20px;
}
#mbox {
  background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
  width: 100%; max-width: 680px; max-height: 87vh;
  display: flex; flex-direction: column; overflow: hidden;
}
.mhdr {
  display: flex; align-items: center; justify-content: space-between;
  padding: 13px 18px; border-bottom: 1px solid var(--border); flex-shrink: 0;
}
.mtitle { font-size: 13px; letter-spacing: 3px; text-transform: uppercase; color: var(--accent); }
.mclose {
  background: none; border: none; color: var(--muted); cursor: pointer;
  font-size: 20px; line-height: 1; font-family: inherit;
}
.mclose:hover { color: var(--text); }
.mbody { flex: 1; overflow-y: auto; padding: 16px 18px; }
.mfooter {
  padding: 10px 18px; border-top: 1px solid var(--border);
  display: flex; gap: 8px; justify-content: flex-end; flex-shrink: 0;
}
.mbtn {
  background: var(--panel2); border: 1px solid var(--border); color: var(--text);
  font-family: inherit; font-size: 12px; letter-spacing: 1px; text-transform: uppercase;
  padding: 9px 16px; cursor: pointer; border-radius: 4px; transition: border-color .2s, color .2s;
}
.mbtn:hover   { border-color: var(--accent); color: var(--accent); }
.mbtn.pri     { border-color: var(--accent); color: var(--accent); }
.mbtn.ok      { border-color: var(--green); color: var(--green); }
.mbtn.danger  { border-color: var(--red); color: var(--red); }
.mbtn:disabled { opacity: .35; cursor: not-allowed; }

/* mission cards */
.mcard {
  background: var(--panel2); border: 1px solid var(--border); border-radius: 6px;
  padding: 13px; margin-bottom: 9px; cursor: pointer; transition: border-color .2s;
}
.mcard:hover  { border-color: var(--accent); }
.mcard-title  { color: var(--accent); font-size: 13px; font-weight: bold; margin-bottom: 4px; }
.mcard-meta   { font-size: 10px; color: var(--muted); margin-bottom: 5px; }
.mcard-desc   { font-size: 12px; line-height: 1.6; }
.mcard-giver  { font-size: 11px; color: var(--orange); margin-top: 6px; }

/* event cards */
.ecard {
  background: var(--panel2); border: 1px solid var(--border); border-left: 3px solid var(--purple);
  border-radius: 6px; padding: 14px; margin-bottom: 12px;
}
.ecard-title  { color: var(--purple); font-size: 13px; font-weight: bold; margin-bottom: 4px; }
.ecard-meta   { font-size: 10px; color: var(--muted); margin-bottom: 8px; }
.ecard-desc   { font-size: 12px; line-height: 1.65; margin-bottom: 12px; }
.ecard-opts   { display: flex; flex-direction: column; gap: 6px; }
.eopt {
  background: var(--panel); border: 1px solid var(--border); border-radius: 4px;
  padding: 8px 12px; cursor: pointer; font-size: 12px; transition: border-color .2s;
}
.eopt:hover { border-color: var(--purple); }
.eopt.sel   { border-color: var(--purple); background: #140e28; }

/* NPC chat */
.npc-log {
  height: 230px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; margin-bottom: 12px;
}
.npc-m { font-size: 12px; line-height: 1.6; }
.npc-m.npc-line   { color: var(--orange); }
.npc-m.you-line   { color: var(--accent); text-align: right; }
.npc-m .who { font-size: 10px; color: var(--muted); display: block; margin-bottom: 2px; }
.npc-m.you-line .who { text-align: right; }

/* stat upgrade rows */
.sup-row {
  display: flex; align-items: center; gap: 10px; padding: 8px 0;
  border-bottom: 1px solid var(--border);
}
.sup-row:last-child { border-bottom: none; }
.sup-name { flex: 1; font-size: 12px; }
.sup-lvl  { color: var(--accent); width: 18px; text-align: center; font-size: 12px; }
.sup-bar  { flex: 0 0 72px; }
.sup-bar .bt { height: 4px; background: var(--border); border-radius: 2px; overflow: hidden; }
.sup-bar .bf { height: 100%; background: var(--accent); border-radius: 2px; transition: width .3s; }
.sup-cost  { font-size: 10px; color: var(--gold); white-space: nowrap; min-width: 70px; text-align: right; }
.sup-btn {
  background: none; border: 1px solid var(--border); border-radius: 3px; color: var(--muted);
  font-family: inherit; font-size: 10px; padding: 3px 8px; cursor: pointer;
  transition: border-color .2s, color .2s; white-space: nowrap;
}
.sup-btn:hover    { border-color: var(--gold); color: var(--gold); }
.sup-btn:disabled { opacity: .3; cursor: not-allowed; }

/* inputs */
.minput, select.minput-sel {
  width: 100%; background: var(--panel2); border: 1px solid var(--border); border-radius: 4px;
  color: var(--text); font-family: inherit; font-size: 12px;
  padding: 9px 12px; outline: none; transition: border-color .2s;
}
.minput:focus { border-color: var(--accent); }
textarea.minput { resize: vertical; }
select.minput-sel { cursor: pointer; }
.minput-row { display: flex; gap: 8px; margin-bottom: 10px; }
.minput-row select.minput-sel { flex: 1; }
.label-sm { font-size: 11px; letter-spacing: 2px; color: var(--muted); text-transform: uppercase; margin-bottom: 8px; display: block; }
.outcome-row { display: flex; gap: 8px; margin-bottom: 10px; }
.outcome-row select.minput-sel { flex: 0 0 140px; }

/* spinner */
.spin {
  display: inline-block; width: 12px; height: 12px;
  border: 2px solid var(--border); border-top-color: var(--accent);
  border-radius: 50%; animation: spin .6s linear infinite; vertical-align: middle;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* toast */
.toast {
  position: fixed; bottom: 64px; right: 16px; z-index: 300;
  background: var(--panel); border: 1px solid var(--accent); border-radius: 6px;
  padding: 10px 14px; font-size: 12px; color: var(--accent);
  animation: tin .3s ease; max-width: 280px; pointer-events: none;
}
@keyframes tin { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; } }

/* scrollbar */
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

/* DM scene system */
.dm-scene { margin: 12px 0 8px; }
.dm-scene-text {
  color: var(--text); font-size: 15px; line-height: 1.8;
  white-space: pre-wrap; border-left: 2px solid var(--accent);
  padding-left: 14px; margin-bottom: 10px;
}
.dm-scene-text.typing { border-left-color: var(--muted); }
.player-action-entry {
  color: var(--accent); font-size: 13px; padding: 4px 0 4px 16px;
  border-left: 2px solid var(--muted);
}
.dm-suggestions {
  display: flex; flex-wrap: wrap; gap: 7px; padding: 6px 0 10px 16px;
}
.dm-sug-btn {
  background: var(--panel2); border: 1px solid var(--border); border-radius: 4px;
  color: var(--muted); font-family: inherit; font-size: 12px;
  padding: 6px 12px; cursor: pointer; transition: border-color .2s, color .2s;
  text-align: left;
}
.dm-sug-btn:hover { border-color: var(--accent); color: var(--text); }
.mission-mode-bar {
  background: #0e0a1a; border-bottom: 1px solid var(--purple);
  padding: 6px 16px; font-size: 11px; color: var(--purple);
  letter-spacing: 1px; display: none; flex-shrink: 0;
}
.mission-mode-bar.active { display: block; }
.action-zone {
  border-top: 1px solid var(--border); background: var(--panel2);
  padding: 10px 16px; flex-shrink: 0;
}
.action-input-row {
  display: flex; gap: 8px; align-items: center;
}
.action-input {
  flex: 1; background: var(--panel); border: 1px solid var(--border); border-radius: 4px;
  color: var(--text); font-family: inherit; font-size: 14px;
  padding: 10px 14px; outline: none; transition: border-color .2s;
}
.action-input:focus { border-color: var(--accent); }
.action-input:disabled { opacity: .4; }
.act-send-btn {
  background: var(--accent); border: none; border-radius: 4px;
  color: var(--bg); font-family: inherit; font-size: 13px; font-weight: bold;
  padding: 10px 18px; cursor: pointer; transition: opacity .2s;
  white-space: nowrap;
}
.act-send-btn:disabled { opacity: .4; cursor: not-allowed; }
.scene-outcome {
  border: 1px solid var(--green); border-radius: 6px; padding: 14px;
  margin: 10px 0; background: #0a1a10;
}
.scene-outcome.failure { border-color: var(--red); background: #1a0a0a; }
.scene-outcome.partial { border-color: var(--orange); background: #1a120a; }
.scene-outcome-title { font-size: 11px; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 6px; }
.scene-outcome.success .scene-outcome-title { color: var(--green); }
.scene-outcome.failure .scene-outcome-title { color: var(--red); }
.scene-outcome.partial .scene-outcome-title { color: var(--orange); }
</style>
</head>
<body>

<!-- ─── BOOT ────────────────────────────────────────────────── -->
<div id="screen-boot" class="screen active">
  <div style="text-align:center">
    <div class="boot-kicker">The Architect Protocol</div>
    <div class="boot-title">ARCHITECT</div>
    <div class="boot-line"></div>
    <div class="boot-sub">An AI-powered RPG · Every world is uniquely yours</div>
    <button class="boot-btn" id="btn-new">ENTER FACILITY</button>
    <div class="boot-restore hidden" id="btn-restore">↩ Restore previous session</div>
  </div>
</div>

<!-- ─── ONBOARDING ──────────────────────────────────────────── -->
<div id="screen-onboard" class="screen">
  <div class="onboard-hdr">
    <div class="onboard-hdr-title">The Architect — Intake Facility</div>
    <div class="onboard-badge" id="onboard-badge">Initializing</div>
  </div>
  <div class="chat-log" id="chat-log"></div>
  <div class="chat-input-area">
    <input type="text" class="chat-input" id="chat-input"
           placeholder="Respond to The Architect…" autocomplete="off" disabled />
    <button class="btn-send" id="btn-send" disabled>Send</button>
    <button class="btn-gen" id="btn-gen">Generate Worlds</button>
  </div>
</div>

<!-- ─── WORLD CHOICE ────────────────────────────────────────── -->
<div id="screen-worlds" class="screen">
  <div class="worlds-hdr">
    <h2>Choose Your World</h2>
    <div class="worlds-msg" id="worlds-msg"></div>
  </div>
  <div class="worlds-grid" id="worlds-grid"></div>
</div>

<!-- ─── GAME ────────────────────────────────────────────────── -->
<div id="screen-game" class="screen">
  <div class="game-topbar">
    <div class="game-world-name" id="g-world">—</div>
    <div class="game-day" id="g-day">Day 1</div>
    <div class="game-sid" id="g-sid" title="Click to copy"></div>
  </div>
  <div class="game-body">
    <div class="game-log" id="game-log"></div>
    <div class="game-side" id="game-side">
      <div>
        <div class="side-label">Resources</div>
        <div class="side-currency" id="s-cur">—</div>
        <div class="side-cur-name" id="s-curname">—</div>
      </div>
      <div>
        <div class="side-label">Stats</div>
        <div id="s-stats"></div>
      </div>
      <div>
        <div class="side-label">World State</div>
        <div id="s-factions"></div>
      </div>
    </div>
  </div>
  <!-- mission mode indicator -->
  <div class="mission-mode-bar" id="mission-bar">
    ⚔ MISSION: <span id="mission-bar-title"></span>
  </div>
  <!-- player action zone -->
  <div class="action-zone">
    <div class="action-input-row">
      <input type="text" class="action-input" id="action-input"
             placeholder="What do you do? (or click a suggestion above)" autocomplete="off" disabled />
      <button class="act-send-btn" id="btn-act" disabled>Act →</button>
    </div>
  </div>
  <!-- secondary bar -->
  <div class="game-bar">
    <button class="act-btn hi" id="btn-explore">Explore</button>
    <button class="act-btn" id="btn-missions">Missions <span class="badge hidden" id="m-badge"></span></button>
    <button class="act-btn" id="btn-day">Advance Day</button>
    <button class="act-btn" id="btn-status">Status</button>
    <button class="act-btn" id="btn-save">Save</button>
  </div>
</div>

<!-- ─── MODAL ───────────────────────────────────────────────── -->
<div id="overlay" class="hidden">
  <div id="mbox">
    <div class="mhdr">
      <div class="mtitle" id="mtitle">—</div>
      <button class="mclose" id="mclose">×</button>
    </div>
    <div class="mbody" id="mbody"></div>
    <div class="mfooter hidden" id="mfooter"></div>
  </div>
</div>

<script>
'use strict';

// ─── State ──────────────────────────────────────────────────────
const G = {
  sid: null,
  world: null,
  archetype: null,
  missions: [],
  npcs: {},
  npcHistory: {},
  day: 1,
  res: null,
  ws: null,
  activeEvents: [],
  worldState: null,
};
G.currentScene = null;
G.activeMissionId = null;
G.activeMissionTitle = '';
G.acting = false;

// ─── API ─────────────────────────────────────────────────────────
async function api(method, path, body) {
  const opts = { method, headers: {'Content-Type':'application/json'} };
  if (body !== undefined) opts.body = JSON.stringify(body);
  const r = await fetch(path, opts);
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.detail || `HTTP ${r.status}`);
  return d;
}

// ─── Screens ─────────────────────────────────────────────────────
function show(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

// ─── Escape ──────────────────────────────────────────────────────
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

// ─── Time (browser local timezone) ───────────────────────────────
function fmtTime(isoStr) {
  if (!isoStr) return '';
  try {
    return new Date(isoStr).toLocaleString('en-US', {
      timeZone: Intl.DateTimeFormat().resolvedOptions().timeZone,
      month: 'short', day: 'numeric',
      hour: 'numeric', minute: '2-digit', hour12: true,
    });
  } catch { return isoStr; }
}

// ─── Toast ───────────────────────────────────────────────────────
function toast(msg, color) {
  const el = document.createElement('div');
  el.className = 'toast';
  if (color) el.style.cssText = `border-color:${color};color:${color}`;
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 3200);
}

// ─── Modal ───────────────────────────────────────────────────────
function modal(title, body, footer) {
  document.getElementById('mtitle').textContent = title;
  document.getElementById('mbody').innerHTML = body;
  const f = document.getElementById('mfooter');
  if (footer) { f.innerHTML = footer; f.classList.remove('hidden'); }
  else { f.innerHTML = ''; f.classList.add('hidden'); }
  document.getElementById('overlay').classList.remove('hidden');
}
function closeModal() {
  document.getElementById('overlay').classList.add('hidden');
  document.getElementById('mbody').innerHTML = '';
}
document.getElementById('mclose').addEventListener('click', closeModal);
document.getElementById('overlay').addEventListener('click', e => {
  if (e.target.id === 'overlay') closeModal();
});

// ─── Game log ────────────────────────────────────────────────────
function log(text, type='') {
  const el = document.createElement('div');
  el.className = 'log-e' + (type ? ' '+type : '');
  el.textContent = text;
  const c = document.getElementById('game-log');
  c.appendChild(el);
  c.scrollTop = c.scrollHeight;
}
const div = () => log('─'.repeat(50), 'div');

// ─── Typewriter ──────────────────────────────────────────────────
function typeBubble(el, text, speed=14) {
  return new Promise(res => {
    el.classList.add('typing-cur');
    let i = 0;
    const tick = () => {
      if (i < text.length) {
        el.textContent += text[i++];
        const log = el.closest('.chat-log');
        if (log) log.scrollTop = log.scrollHeight;
        setTimeout(tick, speed);
      } else { el.classList.remove('typing-cur'); res(); }
    };
    tick();
  });
}
function addMsg(speaker, text, isUser) {
  const c = document.getElementById('chat-log');
  const row = document.createElement('div');
  row.className = 'msg-row' + (isUser ? ' user' : '');
  row.innerHTML = `<div class="msg-speaker">${esc(speaker)}</div><div class="msg-bubble">${text ? esc(text) : ''}</div>`;
  c.appendChild(row);
  c.scrollTop = c.scrollHeight;
  return row.querySelector('.msg-bubble');
}
async function archSay(text) {
  const b = addMsg('Architect', '', false);  // empty — typeBubble fills it
  await typeBubble(b, text, 15);
}
function youSay(text) { addMsg('You', text, true); }

// ─── Sidebar ─────────────────────────────────────────────────────
const STAT_KEYS = ['combat','stealth','persuasion','intellect','endurance','luck'];

function updateSidebar() {
  if (!G.res) return;
  const inv = G.res.inventory;
  document.getElementById('s-cur').textContent = Math.floor(inv.currency).toLocaleString();
  document.getElementById('s-curname').textContent = inv.currency_name || 'gold';

  const stats = G.res.stats;
  document.getElementById('s-stats').innerHTML = STAT_KEYS.map(k => {
    const s = stats[k] || {level:1, display_name: k[0].toUpperCase()+k.slice(1)};
    const v = s.level ?? s, nm = s.display_name || (k[0].toUpperCase()+k.slice(1));
    return `<div class="side-stat">
      <span class="side-stat-name">${nm}</span>
      <span class="side-stat-right">
        <span class="side-bar"><span class="side-bar-fill" style="width:${v*10}%"></span></span>
        <span class="side-stat-val">${v}</span>
      </span></div>`;
  }).join('');

  if (G.worldState) updateFactions(G.worldState);
}
function updateFactions(ws) {
  G.worldState = ws;
  const el = document.getElementById('s-factions'), facs = ws.factions || {};
  const entries = Object.entries(facs);
  if (!entries.length) { el.innerHTML = '<span style="color:var(--muted);font-size:11px">—</span>'; return; }
  el.innerHTML = entries.map(([name, f]) => {
    const lbl = (f.label||'neutral').toLowerCase();
    return `<div class="side-faction"><span>${esc(name)}</span><span class="flbl fl-${lbl}">${lbl}</span></div>`;
  }).join('');
}
function badgeMissions() {
  const b = document.getElementById('m-badge');
  if (G.missions.length) { b.textContent = G.missions.length; b.classList.remove('hidden'); }
  else b.classList.add('hidden');
}
function badgeEvents() {
  const b = document.getElementById('e-badge');
  if (G.activeEvents.length) { b.textContent = G.activeEvents.length; b.classList.remove('hidden'); }
  else b.classList.add('hidden');
}

// ─── DM Scene system ─────────────────────────────────────────────
function dmLog(text, cls='') {
  const el = document.createElement('div');
  el.className = `log-e dm-scene${cls?' '+cls:''}`;
  const inner = document.createElement('div');
  inner.className = 'dm-scene-text typing';
  el.appendChild(inner);
  const c = document.getElementById('game-log');
  c.appendChild(el);
  c.scrollTop = c.scrollHeight;
  return inner;
}

async function typeDM(el, text) {
  return new Promise(res => {
    let i = 0;
    const c = document.getElementById('game-log');
    const tick = () => {
      if (i < text.length) {
        el.textContent += text[i++];
        c.scrollTop = c.scrollHeight;
        setTimeout(tick, 12);
      } else {
        el.classList.remove('typing');
        res();
      }
    };
    tick();
  });
}

function renderSuggestions(suggestions) {
  if (!suggestions || !suggestions.length) return;
  const el = document.createElement('div');
  el.className = 'log-e dm-suggestions';
  suggestions.forEach(s => {
    const btn = document.createElement('button');
    btn.className = 'dm-sug-btn';
    btn.textContent = s;
    btn.onclick = () => {
      document.getElementById('action-input').value = s;
      document.getElementById('action-input').focus();
    };
    el.appendChild(btn);
  });
  const c = document.getElementById('game-log');
  c.appendChild(el);
  c.scrollTop = c.scrollHeight;
}

function setActing(on) {
  G.acting = on;
  document.getElementById('action-input').disabled = on;
  document.getElementById('btn-act').disabled = on;
}

function updateMissionBar() {
  const bar = document.getElementById('mission-bar');
  const title = document.getElementById('mission-bar-title');
  if (G.activeMissionId) {
    bar.classList.add('active');
    title.textContent = G.activeMissionTitle;
  } else {
    bar.classList.remove('active');
    title.textContent = '';
  }
}

async function doExplore() {
  if (G.acting) return;
  G.activeMissionId = null;
  G.activeMissionTitle = '';
  updateMissionBar();
  setActing(true);
  log('─'.repeat(50), 'div');
  log('Entering the world…', 'sys');
  try {
    const d = await api('POST', `/scenes/${G.sid}/explore`);
    G.currentScene = d.scene;
    const el = dmLog();
    await typeDM(el, d.scene.description);
    renderSuggestions(d.scene.suggestions);
    if (d.world_state) updateFactions(d.world_state);
    setActing(false);
  } catch(e) {
    toast(`Explore failed: ${e.message}`, 'var(--red)');
    setActing(false);
  }
}

async function doAct() {
  if (G.acting) return;
  const inp = document.getElementById('action-input');
  const action = inp.value.trim();
  if (!action) { inp.focus(); return; }
  inp.value = '';
  setActing(true);

  const pEl = document.createElement('div');
  pEl.className = 'log-e player-action-entry';
  pEl.textContent = '▶ ' + action;
  document.getElementById('game-log').appendChild(pEl);
  document.getElementById('game-log').scrollTop = 99999;

  try {
    const d = await api('POST', `/scenes/${G.sid}/act`, { action });

    const el = dmLog();
    await typeDM(el, d.narrative);

    if (d.mission_outcome) {
      const result = d.mission_outcome.result;
      const outcomeEl = document.createElement('div');
      outcomeEl.className = `log-e scene-outcome ${result}`;
      outcomeEl.innerHTML = `<div class="scene-outcome-title">Mission ${result.toUpperCase()}</div>
        <div style="font-size:13px;line-height:1.65">${esc(d.mission_outcome.summary)}</div>`;
      document.getElementById('game-log').appendChild(outcomeEl);
      document.getElementById('game-log').scrollTop = 99999;
      G.activeMissionId = null;
      G.activeMissionTitle = '';
      updateMissionBar();
      toast(`Mission ${result}`, result==='success'?'var(--green)':result==='failure'?'var(--red)':'var(--orange)');
      G.missions = G.missions.filter(m => m.id !== d.mission_id);
      badgeMissions();
      api('GET', `/resources/${G.sid}`).then(r => {
        G.res = { stats: r.stats, inventory: r.inventory, stat_flavors: r.stat_flavors||{} };
        updateSidebar();
      }).catch(()=>{});
    }

    if (d.quest_discovered) {
      G.missions.push(d.quest_discovered);
      badgeMissions();
      log(`New quest: ${d.quest_discovered.title}`, 'reward');
      toast(`Quest discovered: ${d.quest_discovered.title}`, 'var(--gold)');
    }

    if (d.npc_encountered) {
      log(`Encountered: ${d.npc_encountered.name} (${d.npc_encountered.role})`, 'npc');
    }

    if (d.world_state) updateFactions(d.world_state);

    if (d.next_scene) {
      G.currentScene = d.next_scene;
      renderSuggestions(d.next_scene.suggestions);
    }

    setActing(false);
  } catch(e) {
    toast(`Error: ${e.message}`, 'var(--red)');
    setActing(false);
  }
}

async function startMission(mid) {
  const m = G.missions.find(x => x.id === mid);
  if (!m) return;
  closeModal();
  setActing(true);
  log('─'.repeat(50), 'div');
  log(`MISSION: ${m.title}`, 'act');
  if (m.description) log(m.description, 'sys');
  log('─'.repeat(50), 'div');
  G.activeMissionId = mid;
  G.activeMissionTitle = m.title;
  updateMissionBar();
  try {
    const d = await api('POST', `/scenes/${G.sid}/start-mission/${mid}`);
    G.currentScene = d.scene;
    const el = dmLog();
    await typeDM(el, d.scene.description);
    renderSuggestions(d.scene.suggestions);
    if (d.world_state) updateFactions(d.world_state);
    setActing(false);
  } catch(e) {
    toast(`Failed to start mission: ${e.message}`, 'var(--red)');
    G.activeMissionId = null;
    G.activeMissionTitle = '';
    updateMissionBar();
    setActing(false);
  }
}

// ─── Onboarding ──────────────────────────────────────────────────
let _typing = false, _ready = false;

async function startNew() {
  const d = await api('POST', '/onboarding/start');
  G.sid = d.session_id;
  localStorage.setItem('rpg_sid', G.sid);
  show('screen-onboard');
  enableInput(false);
  await archSay(d.message);
  enableInput(true);
}
function enableInput(on) {
  document.getElementById('chat-input').disabled = !on;
  document.getElementById('btn-send').disabled = !on;
  if (on) document.getElementById('chat-input').focus();
}
async function sendMsg() {
  if (_typing || _ready) return;
  const inp = document.getElementById('chat-input');
  const msg = inp.value.trim();
  if (!msg) return;
  inp.value = '';
  enableInput(false);
  youSay(msg);
  _typing = true;
  try {
    const d = await api('POST', `/onboarding/${G.sid}/respond`, { message: msg });
    await archSay(d.reply);
    if (d.ready) {
      _ready = true;
      document.getElementById('btn-gen').style.display = 'inline-block';
      document.getElementById('btn-send').style.display = 'none';
    }
  } catch(e) { await archSay(`[System: ${e.message}]`); }
  _typing = false;
  if (!_ready) enableInput(true);
}
async function doGenWorlds() {
  const gb = document.getElementById('btn-gen');
  gb.disabled = true;
  gb.innerHTML = '<span class="spin"></span> Generating…';
  try {
    const d = await api('POST', `/onboarding/${G.sid}/generate-options`);
    document.getElementById('worlds-msg').textContent = d.facility_message;
    document.getElementById('worlds-grid').innerHTML = d.options.map(opt => `
      <div class="world-card" onclick="pickWorld('${opt.id}')">
        <div class="world-card-lbl">World ${opt.id} — ${esc(opt.label)}</div>
        <div class="world-card-name">${esc(opt.name||'?')}</div>
        <div class="world-card-tag">${esc(opt.tagline||'')}</div>
        <div class="world-card-tone">${esc(opt.tone||'')}</div>
        <div class="world-card-preview">${esc(opt.setting_preview||'')}</div>
        <button class="world-card-btn">Choose World ${opt.id}</button>
      </div>`).join('');
    show('screen-worlds');
  } catch(e) {
    toast(`Failed: ${e.message}`, 'var(--red)');
    gb.disabled = false;
    gb.textContent = 'Generate Worlds';
  }
}
async function pickWorld(choice) {
  try {
    const d = await api('POST', `/onboarding/${G.sid}/choose`, { choice });
    G.world = d.world;
    G.archetype = d.archetype;
    // configure to casual so all save slots work
    await api('POST', `/saves/${G.sid}/configure`, { difficulty: 'casual', world_name: G.world.name || '' }).catch(()=>{});
    const r = await api('POST', `/resources/${G.sid}/initialize`);
    G.res = { stats: r.stats, inventory: r.inventory, stat_flavors: r.stat_flavors||{} };
    enterGame();
  } catch(e) { toast(`Error: ${e.message}`, 'var(--red)'); }
}

// ─── Enter game ──────────────────────────────────────────────────
function enterGame() {
  const w = G.world;
  document.getElementById('g-world').textContent = w.name || 'Unknown World';
  document.getElementById('g-sid').textContent = G.sid.slice(0,8)+'…';
  document.getElementById('g-sid').title = 'Session: '+G.sid+' (click to copy)';
  updateSidebar();
  show('screen-game');
  document.getElementById('action-input').disabled = false;
  document.getElementById('btn-act').disabled = false;

  div();
  log(`WORLD: ${w.name}`, 'act');
  if (w.tagline) log(w.tagline, 'prose');
  div();
  if (w.setting) log(w.setting.slice(0,480)+(w.setting.length>480?'…':''), 'sys');
  div();
  log('Your story begins. The world awaits.', 'sys');
  setTimeout(() => genMissions(true), 800);
}

// ─── Missions ────────────────────────────────────────────────────
async function genMissions(silent) {
  try {
    const d = await api('POST', `/missions/${G.sid}/generate`);
    G.missions = d.pool || [];
    if (d.world_state) updateFactions(d.world_state);
    badgeMissions();
    if (!silent) toast(`${G.missions.length} missions generated`);
    else log(`${G.missions.length} missions available in your pool.`, 'sys');
  } catch(e) { toast(`Mission error: ${e.message}`, 'var(--red)'); }
}
function showMissions() {
  if (!G.missions.length) {
    modal('MISSIONS',
      `<div style="text-align:center;padding:24px;color:var(--muted)">No missions. Generate a new batch.</div>
       <div style="text-align:center;margin-top:10px">
         <button class="mbtn pri" onclick="genMissions().then(()=>closeModal()).then(()=>showMissions())">Generate</button>
       </div>`);
    return;
  }
  modal('MISSIONS',
    G.missions.map(m => `
      <div class="mcard" onclick="startMission('${esc(m.id)}')">
        <div class="mcard-title">${esc(m.title)}</div>
        <div class="mcard-meta">${esc(m.type||'')} · ${esc(m.difficulty||'medium')} difficulty</div>
        <div class="mcard-desc">${esc((m.description||'').slice(0,150))}${(m.description||'').length>150?'…':''}</div>
        ${m.giver?`<div class="mcard-giver">Giver: ${esc(m.giver.name||'')} · ${esc(m.giver.faction||'')}</div>`:''}
      </div>`).join(''),
    `<button class="mbtn" onclick="genMissions().then(()=>{closeModal();showMissions()})">Generate New</button>
     <button class="mbtn" onclick="closeModal()">Close</button>`
  );
}
function showMissionDetail(mid) {
  const m = G.missions.find(x => x.id === mid);
  if (!m) return;
  const apps = (m.suggested_approaches||[]).map(a =>
    `<div style="padding:5px 0;border-bottom:1px solid var(--border);font-size:12px;color:var(--muted)">${esc(a)}</div>`
  ).join('');
  modal(`MISSION: ${m.title}`, `
    <div style="margin-bottom:12px">
      <div class="mcard-title" style="font-size:15px;margin-bottom:5px">${esc(m.title)}</div>
      <div class="mcard-meta">${esc(m.type||'')} · ${esc(m.difficulty||'medium')} · ${esc(m.estimated_duration||'')}</div>
    </div>
    <div style="font-size:12px;line-height:1.7;margin-bottom:14px">${esc(m.description||'')}</div>
    ${m.objective?`<div style="font-size:11px;color:var(--accent);margin-bottom:12px">Objective: ${esc(m.objective)}</div>`:''}
    ${apps?`<span class="label-sm">Suggested Approaches</span>${apps}<div style="height:12px"></div>`:''}
    <span class="label-sm">How did it go?</span>
    <div class="outcome-row">
      <select id="out-sel" class="minput-sel">
        <option value="success">Success</option>
        <option value="partial">Partial</option>
        <option value="failure">Failure</option>
      </select>
    </div>
    <textarea id="app-inp" class="minput" rows="3"
      placeholder="Describe your approach — what you did, how you handled it…"></textarea>
  `,
  `<button class="mbtn" onclick="showMissions()">← Back</button>
   <button class="mbtn pri" onclick="completeMission('${mid}')">Complete Mission</button>`
  );
}
async function completeMission(mid) {
  const approach = document.getElementById('app-inp')?.value.trim();
  const outcome  = document.getElementById('out-sel')?.value || 'success';
  if (!approach) { toast('Describe your approach first', 'var(--orange)'); return; }
  const m = G.missions.find(x => x.id === mid);
  closeModal();
  try {
    const d = await api('POST', `/missions/${G.sid}/complete`, {
      mission_id: mid, outcome, approach_used: approach, apply_rewards: true,
    });
    G.missions = G.missions.filter(x => x.id !== mid);
    badgeMissions();
    div();
    log(`MISSION ${outcome.toUpperCase()}: ${m?.title||mid}`,
      outcome==='success'?'ok':outcome==='failure'?'warn':'act');
    log(`Approach: ${approach}`, 'sys');
    if (d.reward?.currency) log(`Reward: +${Math.round(d.reward.currency)} ${d.inventory?.currency_name||'gold'}`, 'reward');
    if (d.item_found) { log(`Item found: ${d.item_found.name} — ${d.item_found.description||''}`, 'reward'); toast(`New item: ${d.item_found.name}`, 'var(--gold)'); }
    if (d.world_state) updateFactions(d.world_state);
    const r = await api('GET', `/resources/${G.sid}`).catch(()=>null);
    if (r) { G.res = { stats: r.stats, inventory: r.inventory, stat_flavors: r.stat_flavors||{} }; updateSidebar(); }
    tickEvents(true);
    if (d.suggest_regenerate) log('Mission pool is running low — consider generating more.', 'sys');
  } catch(e) { toast(`Error: ${e.message}`, 'var(--red)'); }
}

// ─── NPC Talk ────────────────────────────────────────────────────
const NPC_ROLES = ['merchant','guard','innkeeper','quest_giver','villain','sage','ally','neutral_bystander','faction_leader','informant'];

function showTalk() {
  const existing = Object.values(G.npcs);
  const w = G.world || {};
  const wFactions = ['independent', ...(w.factions||[]).map(f=>f.name)];

  const existHtml = existing.length ? `
    <span class="label-sm">Known Contacts</span>
    ${existing.map(n => `
      <div class="mcard" onclick="openNpcChat('${n.id}')">
        <div class="mcard-title">${esc(n.name)}</div>
        <div class="mcard-meta">${esc(n.role||'')} · ${esc(n.faction||'independent')}</div>
        ${n.description?`<div class="mcard-desc">${esc(n.description.slice(0,100))}…</div>`:''}
      </div>`).join('')}
    <div style="height:14px"></div>` : '';

  modal('TALK', `${existHtml}
    <span class="label-sm">${existing.length?'Spawn New NPC':'Meet Someone New'}</span>
    <div class="minput-row">
      <select id="npc-role" class="minput-sel">
        ${NPC_ROLES.map(r=>`<option value="${r}">${r}</option>`).join('')}
      </select>
      <select id="npc-fac" class="minput-sel">
        ${wFactions.map(f=>`<option value="${esc(f)}">${esc(f)}</option>`).join('')}
      </select>
    </div>
    <button class="mbtn pri" onclick="spawnNpc()">Spawn NPC</button>
  `);
}
async function spawnNpc() {
  const role = document.getElementById('npc-role')?.value || 'merchant';
  const faction = document.getElementById('npc-fac')?.value || 'independent';
  try {
    const d = await api('POST', `/npcs/${G.sid}/spawn`, { role, faction });
    G.npcs[d.npc.id] = d.npc;
    if (!G.npcHistory[d.npc.id]) G.npcHistory[d.npc.id] = [];
    log(`New contact: ${d.npc.name} (${d.npc.role}, ${d.npc.faction})`, 'act');
    toast(`Met ${d.npc.name}`);
    openNpcChat(d.npc.id);
  } catch(e) { toast(`Spawn failed: ${e.message}`, 'var(--red)'); }
}
function openNpcChat(npcId) {
  const npc = G.npcs[npcId];
  if (!npc) return;
  if (!G.npcHistory[npcId]) G.npcHistory[npcId] = [];
  renderNpcChat(npc);
}
function renderNpcChat(npc) {
  const hist = G.npcHistory[npc.id] || [];
  const histHtml = hist.map(m =>
    m.role === 'assistant'
      ? `<div class="npc-m npc-line"><span class="who">${esc(npc.name)}</span>${esc(m.content)}</div>`
      : `<div class="npc-m you-line"><span class="who">You</span>${esc(m.content)}</div>`
  ).join('') || `<div style="color:var(--muted);font-style:italic;font-size:12px">Begin the conversation…</div>`;

  modal(`${npc.name.toUpperCase()} — ${npc.role}`, `
    <div class="npc-log" id="npc-log">${histHtml}</div>
    <textarea id="npc-inp" class="minput" rows="2" placeholder="What do you say?"></textarea>
  `, `<button class="mbtn" onclick="showTalk()">← Back</button>
      <button class="mbtn pri" id="npc-send" onclick="sendNpc('${npc.id}')">Say It</button>`);
  const nl = document.getElementById('npc-log');
  if (nl) nl.scrollTop = nl.scrollHeight;
  document.getElementById('npc-inp')?.addEventListener('keydown', e => {
    if (e.key==='Enter' && !e.shiftKey) { e.preventDefault(); sendNpc(npc.id); }
  });
}
async function sendNpc(npcId) {
  const inp = document.getElementById('npc-inp');
  const msg = inp?.value.trim();
  if (!msg) return;
  const npc = G.npcs[npcId];
  if (!npc) return;
  inp.value = ''; inp.disabled = true;
  const sb = document.getElementById('npc-send');
  if (sb) sb.disabled = true;
  if (!G.npcHistory[npcId]) G.npcHistory[npcId] = [];
  G.npcHistory[npcId].push({ role: 'user', content: msg });
  try {
    const d = await api('POST', `/npcs/${G.sid}/${npcId}/talk`, { message: msg });
    G.npcHistory[npcId].push({ role: 'assistant', content: d.reply });
    log(`${npc.name}: "${d.reply.slice(0,120)}${d.reply.length>120?'…':''}"`, 'npc');
    renderNpcChat(npc);
  } catch(e) {
    toast(`Error: ${e.message}`, 'var(--red)');
    inp.disabled = false;
    if (sb) sb.disabled = false;
  }
}

// ─── Events ──────────────────────────────────────────────────────
async function tickEvents(silent) {
  try {
    const d = await api('POST', `/events/${G.sid}/tick`);
    G.activeEvents = d.active_events || [];
    if (d.world_state) updateFactions(d.world_state);
    (d.background_events||[]).forEach(e => log(`[World] ${e.title}: ${(e.description||'').slice(0,100)}`, 'evt'));
    if (d.new_active_events?.length) {
      d.new_active_events.forEach(e => log(`[Event] ${e.title} — your response required`, 'evt'));
      if (!silent) showEvents();
    }
    badgeEvents();
  } catch(e) { if (!silent) toast(`Events: ${e.message}`, 'var(--red)'); }
}
const _selOpt = {};
function showEvents() {
  if (!G.activeEvents.length) {
    modal('WORLD EVENTS',
      `<div style="text-align:center;padding:24px;color:var(--muted)">No active events.</div>
       <div style="text-align:center;margin-top:10px">
         <button class="mbtn pri" onclick="tickEvents().then(()=>{if(!G.activeEvents.length)toast('No new events');else showEvents()})">Check World</button>
       </div>`);
    return;
  }
  modal('WORLD EVENTS', G.activeEvents.map(ev => `
    <div class="ecard" id="ev-${ev.id}">
      <div class="ecard-title">${esc(ev.title)}</div>
      <div class="ecard-meta">${esc(ev.type||'')} · ${esc(ev.urgency||'')}</div>
      <div class="ecard-desc">${esc(ev.description||'')}</div>
      <div class="ecard-opts">
        ${(ev.player_options||[]).map(o =>
          `<div class="eopt" id="eo-${ev.id}-${o.id}" onclick="selOpt('${ev.id}','${o.id}',this)">
            <strong>${esc(o.label)}</strong>: ${esc(o.description||'')}
          </div>`).join('')}
      </div>
      ${ev.player_options?.length ? `
        <div style="margin-top:10px">
          <textarea id="ea-${ev.id}" class="minput" rows="2"
            placeholder="How do you approach this?"></textarea>
          <button class="mbtn pri" style="margin-top:8px" onclick="respondEvent('${ev.id}')">Respond</button>
        </div>` : ''}
    </div>`).join(''));
}
function selOpt(evId, optId, el) {
  _selOpt[evId] = optId;
  document.querySelectorAll(`#ev-${evId} .eopt`).forEach(o => o.classList.remove('sel'));
  el.classList.add('sel');
}
async function respondEvent(evId) {
  const optId = _selOpt[evId];
  const approach = document.getElementById(`ea-${evId}`)?.value.trim();
  if (!optId) { toast('Choose an option', 'var(--orange)'); return; }
  if (!approach) { toast('Describe your approach', 'var(--orange)'); return; }
  try {
    const d = await api('POST', `/events/${G.sid}/respond`, {
      event_id: evId, option_id: optId, approach,
    });
    G.activeEvents = G.activeEvents.filter(e => e.id !== evId);
    if (d.world_state) updateFactions(d.world_state);
    badgeEvents();
    log(`[Event] ${d.resolved_event.title}: resolved`, 'evt');
    delete _selOpt[evId];
    if (G.activeEvents.length) showEvents(); else { closeModal(); toast('All events resolved'); }
  } catch(e) { toast(`Error: ${e.message}`, 'var(--red)'); }
}

// ─── Advance Day ─────────────────────────────────────────────────
async function advanceDay() {
  try {
    const d = await api('POST', `/saves/${G.sid}/advance-day`);
    G.day = d.in_game_day;
    document.getElementById('g-day').textContent = `Day ${G.day}`;
    div();
    log(`DAY ${G.day} BEGINS`, 'act');
    if (d.day_start_saved) log('Progress saved.', 'sys');
    await tickEvents(true);
    await genMissions(false);
  } catch(e) { toast(`Error: ${e.message}`, 'var(--red)'); }
}

// ─── Status / Upgrades ────────────────────────────────────────────
async function showStatus() {
  try {
    const r = await api('GET', `/resources/${G.sid}`);
    G.res = { stats: r.stats, inventory: r.inventory, stat_flavors: r.stat_flavors||{} };
    updateSidebar();
    const inv = r.inventory, fl = r.stat_flavors||{}, stats = r.stats;

    const statsHtml = STAT_KEYS.map(k => {
      const s = stats[k] || {level:1, display_name: k[0].toUpperCase()+k.slice(1), upgrade_cost: 100, at_max: false};
      const v = s.level ?? s, nm = s.display_name || (k[0].toUpperCase()+k.slice(1));
      const canUp = !s.at_max, cost = s.upgrade_cost ?? v*100;
      const canAff = inv.currency >= cost;
      return `<div class="sup-row">
        <span class="sup-name">${nm}</span>
        <span class="sup-lvl">${v}</span>
        <span class="sup-bar"><div class="bt"><div class="bf" style="width:${v*10}%"></div></div></span>
        <span class="sup-cost">${canUp ? cost+' '+esc(inv.currency_name||'gold') : 'MAX'}</span>
        <button class="sup-btn" ${(!canUp||!canAff)?'disabled':''} onclick="upgradeStat('${k}')">
          ${canUp?'Upgrade':'—'}</button>
      </div>`;
    }).join('');

    const items = inv.items||[];
    const itemsHtml = items.length
      ? items.map(i => `<div style="padding:8px;background:var(--panel2);border:1px solid var(--border);border-radius:4px;margin-bottom:6px">
          <div style="color:var(--accent);font-weight:bold">${esc(i.name)}</div>
          <div style="display:flex;justify-content:space-between;align-items:baseline">
            <span style="font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1px">${esc(i.type||'item')}</span>
            ${i.acquired_at?`<span style="font-size:10px;color:var(--muted)">${fmtTime(i.acquired_at)}</span>`:''}
          </div>
          <div style="font-size:11px;margin-top:4px">${esc(i.description||'')}</div>
        </div>`).join('')
      : '<div style="color:var(--muted);font-style:italic;font-size:12px">No items yet.</div>';

    const tokens = inv.faction_tokens||{};
    const tokHtml = Object.keys(tokens).length
      ? Object.entries(tokens).map(([f,n])=>
          `<div style="display:flex;justify-content:space-between;padding:4px 0;font-size:12px">
            <span>${esc(f)}</span><span style="color:var(--orange)">${n} tokens</span></div>`).join('')
      : '<div style="color:var(--muted);font-style:italic;font-size:12px">None yet.</div>';

    modal('STATUS', `
      <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:16px">
        <div>
          <div style="font-size:26px;color:var(--gold);font-weight:bold">${Math.floor(inv.currency).toLocaleString()}</div>
          <div style="font-size:11px;color:var(--muted)">${esc(inv.currency_name||'gold')}</div>
        </div>
        <div style="text-align:right;font-size:11px;color:var(--muted)">
          ${G.archetype?.label?`Archetype: ${esc(G.archetype.label)}<br>`:''}Day ${G.day}
        </div>
      </div>
      <span class="label-sm">Stats & Upgrades</span>${statsHtml}
      <div style="height:16px"></div>
      <span class="label-sm">Faction Tokens</span>${tokHtml}
      <div style="height:16px"></div>
      <span class="label-sm">Inventory (${items.length} items)</span>${itemsHtml}
    `, `<button class="mbtn" onclick="closeModal()">Close</button>`);
  } catch(e) { toast(`Error: ${e.message}`, 'var(--red)'); }
}
async function upgradeStat(stat) {
  try {
    const d = await api('POST', `/resources/${G.sid}/upgrade`, { stat });
    toast(`${d.display_name} → level ${d.new_level}`, 'var(--gold)');
    showStatus();
  } catch(e) { toast(e.message, 'var(--red)'); }
}

// ─── Save ────────────────────────────────────────────────────────
function showSave() {
  modal('SAVE GAME', `
    <div style="display:flex;flex-direction:column;gap:8px">
      <button class="mbtn" onclick="doSave('auto')">Auto Save</button>
      <button class="mbtn" onclick="doSave('slot_1')">Slot 1</button>
      <button class="mbtn" onclick="doSave('slot_2')">Slot 2</button>
      <button class="mbtn" onclick="doSave('slot_3')">Slot 3</button>
    </div>
    <div style="margin-top:14px;font-size:11px;color:var(--muted)">
      The game auto-saves when you advance the day.
    </div>
  `);
}
async function doSave(slot) {
  try {
    const d = await api('POST', `/saves/${G.sid}`, { slot });
    closeModal();
    toast(`Saved to ${slot}`);
    const ts = d.meta?.saved_at ? ` — ${fmtTime(d.meta.saved_at)}` : '';
    log(`Game saved. (${slot}${ts})`, 'sys');
  } catch(e) { toast(e.message, 'var(--red)'); }
}

// ─── Restore session ─────────────────────────────────────────────
async function tryRestore() {
  const saved = localStorage.getItem('rpg_sid');
  if (!saved) return false;
  try {
    const worldData = await api('GET', `/world/${saved}`);
    if (!worldData.world) return false;
    G.sid = saved;
    G.world = worldData.world;
    G.archetype = worldData.archetype;

    const mData = await api('GET', `/missions/${saved}`).catch(()=>null);
    if (mData) G.missions = mData.pool || [];

    const rData = await api('GET', `/resources/${saved}`).catch(()=>null);
    if (rData) G.res = { stats: rData.stats, inventory: rData.inventory, stat_flavors: rData.stat_flavors||{} };

    const eData = await api('GET', `/events/${saved}`).catch(()=>null);
    if (eData) {
      G.activeEvents = eData.active_events || [];
      if (eData.world_state) G.worldState = eData.world_state;
    }

    enterGame();
    log('--- Session restored ---', 'sys');
    badgeMissions(); badgeEvents();
    return true;
  } catch(e) {
    localStorage.removeItem('rpg_sid');
    return false;
  }
}

// ─── Init ─────────────────────────────────────────────────────────
function init() {
  if (localStorage.getItem('rpg_sid')) {
    document.getElementById('btn-restore').classList.remove('hidden');
  }

  document.getElementById('btn-new').addEventListener('click', () => {
    localStorage.removeItem('rpg_sid');
    startNew().catch(e => toast(`Start error: ${e.message}`, 'var(--red)'));
  });
  document.getElementById('btn-restore').addEventListener('click', async () => {
    document.getElementById('btn-restore').textContent = 'Restoring…';
    const ok = await tryRestore();
    if (!ok) { toast('Session expired. Starting fresh.', 'var(--orange)'); startNew(); }
  });

  document.getElementById('btn-send').addEventListener('click', sendMsg);
  document.getElementById('chat-input').addEventListener('keydown', e => {
    if (e.key === 'Enter') sendMsg();
  });
  document.getElementById('btn-gen').addEventListener('click', doGenWorlds);

  document.getElementById('btn-explore').addEventListener('click', doExplore);
  document.getElementById('btn-missions').addEventListener('click', showMissions);
  document.getElementById('btn-act').addEventListener('click', doAct);
  document.getElementById('action-input').addEventListener('keydown', e => { if (e.key==='Enter') doAct(); });
  document.getElementById('btn-day').addEventListener('click', advanceDay);
  document.getElementById('btn-status').addEventListener('click', showStatus);
  document.getElementById('btn-save').addEventListener('click', showSave);

  document.getElementById('g-sid').addEventListener('click', () => {
    if (!G.sid) return;
    navigator.clipboard.writeText(G.sid).then(() => toast('Session ID copied'));
  });
}

init();
</script>
</body>
</html>
